<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Strict CSP + Trusted Types: the library works with no inline scripts or styles. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: https:; require-trusted-types-for 'script'; trusted-types confirm-modal">
  <title>Confirm Modal — Demo</title>
  <link rel="stylesheet" href="demo.css">
  <script src="../dist/confirm-modal.min.js" defer></script>
  <script src="demo.js" defer></script>
</head>
<body>
  <header>
    <h1>Confirm Modal</h1>
    <p>Modern dialogs, clear decisions, and effortless feedback. Native <code>&lt;dialog&gt;</code>, zero runtime dependencies, and a fully typed API.</p>
    <label class="theme">Theme
      <select id="theme">
        <option value="auto">System</option>
        <option value="light">Light</option>
        <option value="dark">Dark</option>
      </select>
    </label>
  </header>

  <main>
    <section>
      <h2>Basics</h2>
      <div class="grid">
        <button data-demo="alert">Alert</button>
        <button data-demo="success">Success</button>
        <button data-demo="error">Error</button>
        <button data-demo="confirm">Confirm</button>
        <button data-demo="danger">Destructive action</button>
        <button data-demo="deny">Save / Discard / Cancel</button>
      </div>
    </section>

    <section>
      <h2>Inputs</h2>
      <div class="grid">
        <button data-demo="prompt">Prompt</button>
        <button data-demo="email">Email + validation</button>
        <button data-demo="select">Select</button>
        <button data-demo="radio">Radio</button>
        <button data-demo="checkbox">Checkbox</button>
        <button data-demo="textarea">Textarea</button>
      </div>
    </section>

    <section>
      <h2>Advanced</h2>
      <div class="grid">
        <button data-demo="preconfirm">Async action (preConfirm)</button>
        <button data-demo="timer">Timer</button>
        <button data-demo="html">Sanitized HTML</button>
        <button data-demo="xss">HTML sanitization</button>
        <button data-demo="queue">Queue (3 dialogs)</button>
        <button data-demo="abort">AbortSignal</button>
      </div>
    </section>

    <section>
      <h2>Toast</h2>
      <div class="grid">
        <button data-demo="toast">Notification</button>
        <button data-demo="toast-error">Error toast + action</button>
        <button data-demo="toast-bottom">Bottom center</button>
      </div>
    </section>

    <section>
      <h2>Declarative confirmations</h2>
      <p>These elements use <code>data-cm-confirm</code> attributes:</p>
      <div class="grid">
        <a href="#signed-out" data-cm-confirm="Do you want to sign out?">Sign out (link)</a>
        <button id="declarative-delete" data-cm-confirm="This item will be permanently deleted." data-cm-title="Delete this item?" data-cm-confirm-text="Delete" data-cm-danger>Delete (button)</button>
      </div>
      <form id="declarative-form" data-cm-confirm="Submit this form?">
        <input name="name" placeholder="Your name" aria-label="Your name">
        <button>Submit (form)</button>
      </form>
    </section>

    <section>
      <h2>Latest result</h2>
      <pre id="out" aria-live="polite">—</pre>
    </section>
  </main>
</body>
</html>
