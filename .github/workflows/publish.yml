name: Publish to npm

# Runs when a version tag is pushed, e.g. `npm version patch && git push --follow-tags`.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm provenance and trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      # Trusted publishing (OIDC) needs npm 11.5+.
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm publish --provenance --access public
        env:
          # Used for the first publish. Once a trusted publisher is set up on npmjs.com this secret can be deleted.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
